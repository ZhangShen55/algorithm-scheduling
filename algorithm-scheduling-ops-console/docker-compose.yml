name: algorithm-scheduling-ops-console

services:
  algorithm-scheduling-ops-console:
    build:
      context: .
      args:
        VITE_CONTROL_BASE_URL: "${VITE_CONTROL_BASE_URL:-/control}"
        VITE_GATEWAY_BASE_URL: "${VITE_GATEWAY_BASE_URL:-/gateway}"
        VITE_GPU_BASE_URL: "${VITE_GPU_BASE_URL:-http://192.168.29.11:9400}"
    image: "${OPS_CONSOLE_IMAGE:-algorithm-scheduling-ops-console:local}"
    restart: unless-stopped
    ports:
      - "${OPS_CONSOLE_BIND_HOST:-0.0.0.0}:${OPS_CONSOLE_PORT:-5174}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

[pytest]
addopts = -ra
testpaths = tests
markers =
    contract: 接口兼容性测试
    cpu: CPU 真实模型测试
    gpu: NVIDIA GPU 真实模型测试
    npu: Ascend NPU 真实模型测试
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*
    ignore:No ccache found.*:UserWarning:paddle.utils.cpp_extension.extension_utils

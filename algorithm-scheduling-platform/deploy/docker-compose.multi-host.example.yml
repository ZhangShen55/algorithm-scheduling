name: algorithm-remote-gpu-node

# This file is an example for the remote host 192.168.29.12.
# The platform services and infrastructure stay on 192.168.29.11.
services:
  vbas-29-12-gpu0:
    image: ${VBAS_IMAGE:-algorithm-vbas:v1.0_260831}
    restart: unless-stopped
    network_mode: host
    extra_hosts:
      - "control-service:192.168.29.11"
    security_opt:
      - label=disable
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:28981/ops/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    environment:
      OPERATOR_PORT: "28981"
      PORT: "28981"
      CONFIG_PATH: /workspace/config.toml
      UVICORN_WORKERS: "1"
      PLATFORM_OPERATOR_REGISTRY_TOKEN: ${OPERATOR_REGISTRY_TOKEN:?set the registry token}
      PLATFORM_INSTANCE_ID: vbas-29-12-gpu0
      PLATFORM_HOST_ID: 192.168.29.12
      PLATFORM_GPU_ID: "0"
      PLATFORM_SERVICE_URL: http://192.168.29.12:28981
      PLATFORM_INSTANCE_LABELS: '{"host_id":"192.168.29.12","gpu":"0"}'
      NVIDIA_VISIBLE_DEVICES: "0"
    volumes:
      - {type: bind, source: "${COURSE_ROOT:-/data/course}", target: /data/course}
      - {type: bind, source: "${RESULT_ROOT:-/data/result}", target: /data/result}
      - {type: bind, source: ./config/operators/vbas.gpu.toml, target: /workspace/config.toml, read_only: true}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  screen-det-29-12-gpu1:
    image: ${SCREEN_DET_IMAGE:-algorithm-screen-det:v1.0_260827}
    restart: unless-stopped
    network_mode: host
    extra_hosts:
      - "control-service:192.168.29.11"
    security_opt:
      - label=disable
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:28880/ops/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    environment:
      OPERATOR_PORT: "28880"
      PORT: "28880"
      CONFIG_PATH: /app/config.toml
      UVICORN_WORKERS: "1"
      PLATFORM_OPERATOR_REGISTRY_TOKEN: ${OPERATOR_REGISTRY_TOKEN:?set the registry token}
      PLATFORM_INSTANCE_ID: screen-det-29-12-gpu1
      PLATFORM_HOST_ID: 192.168.29.12
      PLATFORM_GPU_ID: "1"
      PLATFORM_SERVICE_URL: http://192.168.29.12:28880
      PLATFORM_INSTANCE_LABELS: '{"host_id":"192.168.29.12","gpu":"1"}'
      NVIDIA_VISIBLE_DEVICES: "1"
    volumes:
      - {type: bind, source: "${COURSE_ROOT:-/data/course}", target: /data/course}
      - {type: bind, source: "${RESULT_ROOT:-/data/result}", target: /data/result}
      - {type: bind, source: ./config/operators/screen_det.gpu.toml, target: /app/config.toml, read_only: true}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

  gpu-metrics-exporter:
    build:
      context: ../..
      dockerfile: gpu_metrics_exporter/Dockerfile
    image: "${GPU_METRICS_IMAGE:-algorithm-gpu-metrics-exporter:local}"
    restart: unless-stopped
    environment:
      GPU_EXPORTER_PORT: "9400"
      GPU_EXPORTER_HOST_ID: 192.168.29.12
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

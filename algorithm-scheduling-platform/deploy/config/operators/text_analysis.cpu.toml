# 三实例 CPU 服务器文本分析共享配置，保持现有 LLM 地址与模型。
# 默认大模型 API Key。
api_key = "vllm"
# 默认大模型 OpenAI 兼容接口地址。
base_url = "http://10.80.5.130:8855/v1"
# 默认大模型名称。
model = "qwen3-8b"

# 机器翻译服务 API Key。
mt_api_key = "translate"
# 机器翻译服务接口地址。
mt_base_url = "http://10.80.5.25:8866/v1"
# 机器翻译模型名称。
mt_model = "hy-mt"
# 单次翻译分段大小。
segment_size = 1
# 机器翻译最大并发数。
mt_max_concurrency = 256
# 机器翻译队列等待超时时间，单位秒。
mt_queue_timeout = 90

[platform]
# 容器部署时主动向 control-service 注册。
registration_enabled = true
# 容器网络内的 control-service 地址。
control_service_url = "http://control-service:18100"
# 算子注册心跳间隔秒数。
heartbeat_interval_seconds = 5
# 课程脑图与关键词提取共享的单实例平台容量。
max_concurrent_requests = 256

[runtime]
# 文本分析服务不要求本机 CUDA。
require_gpu = false

[eval_weight]
# 课堂评价基础分。
base_score = 16.0
# 权重调节旋钮。
knob = 0.9
# 政治性权重。
politics = 0.1
# 内容权重。
content = 0.25
# 态度权重。
attitude = 0.25
# 方法权重。
method = 0.15
# 效果权重。
effect = 0.25

[course_overview]
# 课程概览默认分段数量。
segment_count = 10
# 课程概览并发处理数量。
concurrency = 4

[course_time_analysis]
# 是否启用课程时间 LLM 校验。
enable_llm_validation = true
# 课程时间分析 LLM 并发数。
llm_concurrency = 4
# 课程时间分析 LLM 重试次数。
llm_retry_attempts = 2
# 候选点前置上下文窗口，单位秒。
candidate_context_before_sec = 120
# 候选点后置上下文窗口，单位秒。
candidate_context_after_sec = 120
# 规则兜底窗口大小，单位秒。
fallback_window_sec = 300
# 最大兜底窗口数量。
max_fallback_windows = 12
# 最大 LLM 候选数量。
max_llm_candidates = 24
# 最短课间时长，单位秒。
min_break_duration_sec = 600
# 最长课间时长，单位秒。
max_break_duration_sec = 2400
# 边界语义分析窗口，单位秒。
boundary_semantic_window_sec = 1800
# 边界语义分块大小，单位秒。
boundary_semantic_chunk_sec = 300
# 边界语义分块重叠，单位秒。
boundary_semantic_overlap_sec = 60
# 课间结束搜索最小范围，单位秒。
break_end_search_min_sec = 300
# 课间结束搜索最大范围，单位秒。
break_end_search_max_sec = 1800
# 课程开始候选预算。
course_start_candidate_budget = 8
# 课程结束候选预算。
course_end_candidate_budget = 8
# 课间开始候选预算。
break_start_candidate_budget = 12
# 课间结束候选预算。
break_end_candidate_budget = 12
# 弱候选预算。
weak_candidate_budget = 8

[language_expression_analysis]
# 语言表达分析分块字符数。
chunk_chars = 3000
# 语言表达分析分块重叠字符数。
chunk_overlap_chars = 300
# 语言表达分析最大分块数。
max_chunks = 20
# 语言表达分析分块并发数。
chunk_concurrency = 4
# 语言表达分析分块重试次数。
chunk_retry_attempts = 2
# 语言表达分析最终汇总重试次数。
final_retry_attempts = 2
# 最小有效文本字符数。
min_effective_chars = 800
# 每个维度最少优势条数。
min_advantages_per_dimension = 2
# 每个维度最少问题条数。
min_problems_per_dimension = 0
# 每个维度最多条目数。
max_items_per_dimension = 4
# 语言表达分析默认温度。
default_temperature = 0.6
# 总分下限。
overall_score_min = 0
# 总分上限。
overall_score_max = 100
# 是否自动调用课程时间分析。
enable_auto_course_time_analysis = true
# 是否启用最终 LLM 润色。
enable_final_llm_polish = true

[course_knowledge_corpus_analysis]
# 知识点语料分析分块字符数。
chunk_chars = 500
# 知识点语料分析分块重叠字符数。
chunk_overlap_chars = 60
# 知识点语料分析最大分块数。
max_chunks = 40
# 知识点语料分析分块并发数。
chunk_concurrency = 4
# 知识点语料分析分块重试次数。
chunk_retry_attempts = 2
# 知识点语料分析最终汇总重试次数。
final_retry_attempts = 2
# 单个分块最多知识点数。
chunk_max_knowledge_points = 3
# 单个分块最多语料数。
chunk_max_corpus = 3
# 最终最多知识点数。
final_max_knowledge_points = 20
# 最终最多语料数。
final_max_corpus = 20
# 知识点描述最大字符数。
max_description_chars = 120
# 语料内容最大字符数。
max_corpus_content_chars = 240

[student_interaction_analysis]
# 学生互动分析分块字符数。
chunk_chars = 2000
# 学生互动分析分块重叠字符数。
chunk_overlap_chars = 150
# 学生互动分析分块并发数。
chunk_concurrency = 4
# 学生互动分析分块重试次数。
chunk_retry_attempts = 2
# 互动复核上下文窗口，单位秒。
verify_context_seconds = 30
# 互动复核重试次数。
verify_retry_attempts = 2
# 相邻互动合并间隔，单位秒。
merge_gap_seconds = 30
# 学生互动分析最大分块数。
max_chunks = 80
# 每个分块最多候选互动数。
max_candidates_per_chunk = 3

[question_classification]
# 问句分类 LLM 并发请求数。
llm_concurrency = 4

[extract_knowledge_v2]
# 是否启用知识点提取分段。
enable_segmentation = true
# 知识点提取最大输入字符数。
max_text_chars = 12000
# 知识点提取分段字符数。
segment_chars = 6000
# 知识点提取分段重叠字符数。
segment_overlap_chars = 300
# 知识点提取最大分段数。
max_segments = 16
# 知识点提取并发数。
concurrency = 4
# 知识点提取整体重试次数。
retry_attempts = 3
# 知识点提取分段重试次数。
segment_retry_attempts = 2
# 是否启用兜底分段。
fallback_split = true
# 每个模块最少确认知识点数。
min_true_per_module = 2

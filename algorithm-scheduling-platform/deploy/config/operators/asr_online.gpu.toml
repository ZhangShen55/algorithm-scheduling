# 三卡服务器实时 ASR 共享配置；容器内 GPU 统一编号为 0。
# SeaCraftASR 在线识别服务配置

id_engine = "online-1"
version = "seacraft-asr-online-v1.0.0"

# 设备配置（建议与主服务使用不同 GPU 以避免显存竞争）
device = "cuda:0"
ngpu = 1

# 日志
log_path = "./asr_online_service.log"

[platform]
# 容器部署时主动向 control-service 注册。
registration_enabled = true
# 容器网络内的 control-service 地址。
control_service_url = "http://control-service:18100"
# 算子注册心跳间隔秒数。
heartbeat_interval_seconds = 5
# 平台允许同时分发到单个实时 ASR 实例的会话数。
max_concurrent_requests = 10

[runtime]
# 三卡部署必须检测到容器内 CUDA 设备。
require_gpu = true

# 模型默认使用镜像内 ./model，可按需添加 [model_paths] 覆盖。

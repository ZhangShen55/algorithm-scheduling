# 三卡服务器 OCR 共享配置；容器内 GPU 统一编号为 0。
[platform]
# 容器部署时主动向 control-service 注册。
registration_enabled = true
# 容器网络内的 control-service 地址。
control_service_url = "http://control-service:18100"
# 算子注册心跳间隔秒数。
heartbeat_interval_seconds = 5
# 平台允许同时分发到单个 OCR 实例的图片请求数。
max_concurrent_requests = 256

[runtime]
# 三卡部署必须检测到容器内 CUDA 设备。
require_gpu = true

[application]
name = "jy-algorithm-app-ocr-v6-service"
version = "OCR_V3.0_PP-OCRv6"

[server]
host = "0.0.0.0"
port = 8866
workers = 1

[ocr]
device = "cuda:0"
detection_model_dir = "models/PP-OCRv6_medium_det"
recognition_model_dir = "models/PP-OCRv6_medium_rec"
recognition_batch_size = 1
cpu_threads = 8
enable_mkldnn = false
enable_hpi = false
max_concurrency = 1
image_max_bytes = 52428800

[ocr.detection]
limit_side_len = 960
threshold = 0.3
box_threshold = 0.6
unclip_ratio = 1.5

[formula]
enabled = true
layout_model_dir = "models/PP-DocLayout_plus-L"
recognition_model_dir = "models/PP-FormulaNet_plus-M"
recognition_batch_size = 1
layout_threshold = 0.5

[logging]
# 日志级别。
level = "INFO"
# 相对项目根的日志目录；未挂载时写入容器内该目录。
directory = "logs"
# 当前实例日志文件名。
file_name = "application.log"
# 单个日志文件最大大小，单位 MiB。
max_file_size_mib = 100
# 归档日志保留天数。
retention_days = 7
# 是否输出到 stdout。
stdout_enabled = true
# 是否写入文件。
file_enabled = true

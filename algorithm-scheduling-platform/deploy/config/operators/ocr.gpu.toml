# 三卡服务器 OCR 共享配置；容器内 GPU 统一编号为 0。
[application]
name = "jy-algorithm-app-ocr-v6-service"
version = "OCR_V3.0_PP-OCRv6"

[server]
host = "0.0.0.0"
port = 8866
workers = 1

[ocr]
device = "cuda:0"
detection_model_dir = "models/PP-OCRv6_medium_det"
recognition_model_dir = "models/PP-OCRv6_medium_rec"
recognition_batch_size = 1
cpu_threads = 8
enable_mkldnn = false
enable_hpi = false
max_concurrency = 1
image_max_bytes = 20971520

[ocr.detection]
limit_side_len = 960
threshold = 0.3
box_threshold = 0.6
unclip_ratio = 1.5

[formula]
enabled = true
layout_model_dir = "models/PP-DocLayout_plus-L"
recognition_model_dir = "models/PP-FormulaNet_plus-M"
recognition_batch_size = 1
layout_threshold = 0.5

[logging]
level = "INFO"
directory = "logs"
max_size_mb = 100
backup_count = 3

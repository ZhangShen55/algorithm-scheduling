services:
  asr-offline-gpu0:
    <<: *asr-offline
    profiles: [gpu0]
    ports: ["18083:8083"]
    environment:
      OPERATOR_PORT: "8083"
      PORT: "8083"
      CONFIG_PATH: /config.toml
      UVICORN_WORKERS: "1"
      PLATFORM_REGISTRATION_ENABLED: "true"
      PLATFORM_CONTROL_SERVICE_URL: http://control-service:18100
      PLATFORM_HEARTBEAT_INTERVAL_SECONDS: "5"
      PLATFORM_INSTANCE_ID: asr-offline-gpu0
      PLATFORM_SERVICE_URL: http://asr-offline-gpu0:8083
      PLATFORM_DECLARED_CAPACITY: "1"
      PLATFORM_GPU_ID: "0"

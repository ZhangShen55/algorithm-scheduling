name: algorithm-operators

x-operator-common: &operator-common
  restart: unless-stopped
  networks: [algorithm-platform]
  healthcheck: &operator-healthcheck
    test:
      - CMD-SHELL
      - >-
        python -c "import os,urllib.request;
        urllib.request.urlopen('http://127.0.0.1:' + os.environ['OPERATOR_PORT'] +
        '/ops/health', timeout=3)"
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 120s

x-gpu0-reservation: &gpu0-reservation
  resources:
    reservations:
      devices:
        - driver: nvidia
          device_ids: ["0"]
          capabilities: [gpu]
x-gpu1-reservation: &gpu1-reservation
  resources:
    reservations:
      devices:
        - driver: nvidia
          device_ids: ["1"]
          capabilities: [gpu]
x-gpu2-reservation: &gpu2-reservation
  resources:
    reservations:
      devices:
        - driver: nvidia
          device_ids: ["2"]
          capabilities: [gpu]

x-operator-environment: &operator-environment
  UVICORN_WORKERS: "1"
  PLATFORM_OPERATOR_REGISTRY_TOKEN: ${OPERATOR_REGISTRY_TOKEN:?OPERATOR_REGISTRY_TOKEN is required}

x-asr-offline-environment: &asr-offline-environment
  <<: *operator-environment
  OPERATOR_PORT: "8083"
  PORT: "8083"
  CONFIG_PATH: /config.toml

x-asr-online-environment: &asr-online-environment
  <<: *operator-environment
  OPERATOR_PORT: "8084"
  PORT: "8084"
  CONFIG_PATH: /config.toml

x-ocr-environment: &ocr-environment
  <<: *operator-environment
  OPERATOR_PORT: "8866"
  CONFIG_PATH: /app/config.toml

x-vbas-environment: &vbas-environment
  <<: *operator-environment
  OPERATOR_PORT: "8981"
  CONFIG_PATH: /workspace/config.toml

x-facerec-environment: &facerec-environment
  <<: *operator-environment
  OPERATOR_PORT: "8000"
  CONFIG_PATH: /config/config.toml
  FACEREC_MONGO_USERNAME: ${MONGO_ROOT_USERNAME:-root}
  FACEREC_MONGO_PASSWORD: ${MONGO_ROOT_PASSWORD:-root}

x-screen-det-environment: &screen-det-environment
  <<: *operator-environment
  OPERATOR_PORT: "8880"
  CONFIG_PATH: /app/config.toml

x-ppt-slice-environment: &ppt-slice-environment
  <<: *operator-environment
  OPERATOR_PORT: "9001"
  CONFIG_PATH: /workspace/config.toml

x-asr-offline: &asr-offline
  <<: *operator-common
  image: ${ASR_OFFLINE_IMAGE:-seacraft-asr-offline:v1.0_260812}
  volumes:
    - {type: bind, source: "${COURSE_ROOT:-/data/course}", target: /data/course}
    - {type: bind, source: "${RESULT_ROOT:-/data/result}", target: /data/result}
    - {type: bind, source: ./config/operators/asr_offline.gpu.toml, target: /config.toml, read_only: true}
x-asr-online: &asr-online
  <<: *operator-common
  image: ${ASR_ONLINE_IMAGE:-seacraft-asr-online:v1.0_260812}
  volumes:
    - {type: bind, source: "${COURSE_ROOT:-/data/course}", target: /data/course}
    - {type: bind, source: "${RESULT_ROOT:-/data/result}", target: /data/result}
    - {type: bind, source: ./config/operators/asr_online.gpu.toml, target: /config.toml, read_only: true}
x-ocr: &ocr
  <<: *operator-common
  image: ${OCR_IMAGE:-algorithm-ocr:v1.0_260812}
  volumes:
    - {type: bind, source: "${COURSE_ROOT:-/data/course}", target: /data/course}
    - {type: bind, source: "${RESULT_ROOT:-/data/result}", target: /data/result}
    - {type: bind, source: ./config/operators/ocr.gpu.toml, target: /app/config.toml, read_only: true}
x-vbas: &vbas
  <<: *operator-common
  image: ${VBAS_IMAGE:-algorithm-vbas:v1.0_260812}
  volumes:
    - {type: bind, source: "${COURSE_ROOT:-/data/course}", target: /data/course}
    - {type: bind, source: "${RESULT_ROOT:-/data/result}", target: /data/result}
    - {type: bind, source: ./config/operators/vbas.gpu.toml, target: /workspace/config.toml, read_only: true}
x-facerec: &facerec
  <<: *operator-common
  image: ${FACEREC_IMAGE:-algorithm-facerec:v1.0_260812}
  healthcheck:
    test:
      - CMD
      - python3
      - -c
      - >-
        import json,os,urllib.request;
        payload=json.load(urllib.request.urlopen(
        'http://127.0.0.1:' + os.environ['OPERATOR_PORT'] + '/ops/health',
        timeout=3));
        raise SystemExit(0 if payload.get('status') == 'healthy' else 1)
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 120s
  volumes:
    - {type: bind, source: "${COURSE_ROOT:-/data/course}", target: /data/course}
    - {type: bind, source: "${RESULT_ROOT:-/data/result}", target: /data/result}
    - {type: bind, source: ./config/operators/facerec.gpu.toml, target: /config/config.toml, read_only: true}
x-screen-det: &screen-det
  <<: *operator-common
  image: ${SCREEN_DET_IMAGE:-algorithm-screen-det:v1.0_260812}
  volumes:
    - {type: bind, source: "${COURSE_ROOT:-/data/course}", target: /data/course}
    - {type: bind, source: "${RESULT_ROOT:-/data/result}", target: /data/result}
    - {type: bind, source: ./config/operators/screen_det.gpu.toml, target: /app/config.toml, read_only: true}
x-ppt-slice: &ppt-slice
  <<: *operator-common
  image: ${PPT_SLICE_IMAGE:-algorithm-ppt-slice:v1.0_260812}
  volumes:
    - {type: bind, source: "${COURSE_ROOT:-/data/course}", target: /data/course}
    - {type: bind, source: "${RESULT_ROOT:-/data/result}", target: /data/result}
    - {type: bind, source: ./config/operators/ppt_slice.cpu.toml, target: /workspace/config.toml, read_only: true}
services:
  asr-offline-gpu0:
    <<: *asr-offline
    profiles: [gpu0]
    ports: ["127.0.0.1:18083:8083"]
    environment:
      <<: *asr-offline-environment
      PLATFORM_INSTANCE_ID: asr-offline-gpu0
      PLATFORM_SERVICE_URL: http://asr-offline-gpu0:8083
      PLATFORM_GPU_ID: "0"
      NVIDIA_VISIBLE_DEVICES: "0"
    deploy: *gpu0-reservation

  asr-offline-gpu1:

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithm-scheduling-platform"
version = "0.1.0"
description = "Single-machine algorithm scheduling platform for offline courses and online inference"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0,<7",
  "redis>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=15,<18",
]

[project.optional-dependencies]
kafka = [
  "aiokafka>=0.14,<0.15",
]
dev = [
  "aiokafka>=0.14,<0.15",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "setuptools>=75",
  "wheel>=0.45",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-ra"
markers = [
  "contract: stable cross-service API and entrypoint contracts",
  "integration: tests requiring local PostgreSQL or other infrastructure",
]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["packages"]

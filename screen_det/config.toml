[platform]
# 本地默认不主动向调度平台注册
registration_enabled = false
control_service_url = ""  # 启用注册时填写 Control Service 地址
heartbeat_interval_seconds = 5  # 注册心跳间隔秒数，必须为有限正数
# 平台允许同时分发到本实例的请求数；不覆盖单请求批量限制
max_concurrent_requests = 128

# =============================================================================
# 屏幕倾斜检测服务 — 统一配置文件
# 修改 [detection] 后可 POST /config/reload 热重载；
# 修改 [yolo] / [model_protection] / [server] 等需重启进程。
# =============================================================================

[app]
# 服务名称，用于根路径与健康检查展示
name = "tilt-detection-service"
# 版本号
version = "1.0.0"
# 是否开启 FastAPI debug（生产建议 false）
debug = false
[server]
# 监听地址；Docker 内保持 0.0.0.0
host = "0.0.0.0"
# 监听端口；与 docker run -p 映射一致
port = 8880
# Uvicorn worker 数量；单 GPU 建议 1（每 worker 启动时各预加载一份 YOLO）
workers = 1

[yolo]
# 两个 YOLO 模型统一推理设备：cpu、mps、cuda:0、cuda:1 等
# 配置 CUDA 但设备不可用时服务启动失败，不回退 CPU
device = "cpu"

[model_protection]
# 开发环境关闭并读取 model/*.pt；生产开启并挂载 models-encrypted
enabled = false
encrypted_model_root = "/run/screen-det/models-encrypted"
key_file = "/run/screen-det/models-encrypted/model.key"
decrypted_temp_root = "/dev/shm/screen-det-models"
cleanup_after_load = true

[screen_detection]
# YOLO 权重路径（相对项目根目录）
weights_path = "model/screen.pt"
# 默认置信度阈值；请求 body 可覆盖
conf = 0.25
# NMS IoU 阈值；请求 body 可覆盖
iou = 0.45
# 对外返回的类别 ID：0=blue 1=black 2=white 3=normal
allowed_class_ids = [0, 1, 2, 3]
# 单次请求最多图片数
max_batch_size = 16

[detection]
# 判定“倾斜”的角度阈值（度）；angle 超过此值时内部 is_tilted=true
tilt_threshold = 1.5
# 有效线段最小长度 = 图像宽度 × 该比例
min_line_length_ratio = 0.1
# 至少检测到多少条有效参考线段才计算角度
min_valid_lines = 5
# 角度样本截断：排序后取 [trim_start_ratio, trim_end_ratio) 区间再求加权平均
trim_start_ratio = 0.2
trim_end_ratio = 0.8
# 高斯模糊核大小（奇数，配置偶数会自动 +1）
gaussian_kernel_size = 5
# Canny 边缘检测低/高阈值
canny_threshold1 = 50
canny_threshold2 = 150
# 视为“水平参考线”的角度范围（度）
horizontal_angle_min = -30
horizontal_angle_max = 30
# 视为“垂直参考线”的角度范围（度）
vertical_angle_min = 60
vertical_angle_max = 120

[logging]
# 日志级别：DEBUG / INFO / WARNING / ERROR
level = "INFO"
# 日志目录（相对项目根目录）
log_dir = "logs"
# 访问日志文件名
access_log = "access.log"
# 应用日志文件名
app_log = "app.log"
# 单个日志文件最大字节数（此处 10MB）
max_bytes = 10485760
# 轮转保留的历史文件个数
backup_count = 10

[runtime]
# 本地默认允许 CPU；GPU 部署配置显式设为 true
require_gpu = false
# 单张图片 Base64 解码后允许的最大字节数（此处 10MB）
max_image_bytes = 10485760

[quality_abnormal_detection]
# 画面异常检测总开关；包含虚焦、偏色、雪花噪点、花屏
enabled = true
# OpenCV 分析前最长边缩放到该尺寸，降低 CPU 开销
analyze_max_side = 960
# 屏蔽顶部时间戳等 overlay 的比例
overlay_top_ratio = 0.08
# 屏蔽底部水印等 overlay 的比例
overlay_bottom_ratio = 0.05
# 偏色 Lab 色偏阈值
color_cast_lab_threshold = 18.0
# 偏色 RGB 通道不平衡阈值
color_cast_imbalance_threshold = 0.25
# 雪花噪点高频噪声阈值
snow_noise_threshold = 14.0
# 雪花噪点边缘密度阈值
snow_edge_density_threshold = 0.18
# 虚焦 Laplacian 方差阈值
blur_laplacian_threshold = 450.0
# 虚焦边缘密度阈值
blur_edge_density_threshold = 0.06
# 花屏分带 Laplacian 阈值
glitch_band_laplacian_threshold = 450.0
# 花屏分带饱和度阈值
glitch_band_saturation_threshold = 28.0
# 花屏异常区域最小占比
glitch_min_area_ratio = 0.18
# 花屏分块行数
glitch_grid_rows = 16
# 花屏分块列数
glitch_grid_cols = 24

[occlusion_detection]
# 镜头近处遮挡检测总开关
enabled = true
# 分析前最长边缩放到该尺寸
analyze_max_side = 960
# YOLO 置信度阈值；请求 threshold 未传时使用该默认值
threshold = 0.25
# 遮挡面积占比判定阈值；请求 area_ratio 未传时使用该默认值
area_ratio = 0.2
# YOLO-seg 遮挡模型权重路径
yolo_seg_weights_path = "model/occlusion.pt"
# YOLO-seg 推理尺寸
yolo_imgsz = 960
# 使用原图尺寸 mask，面积占比更稳定
yolo_retina_masks = true

[aggregate_detection]
# 全量聚合检测总开关
enabled = true
# 默认执行模块；请求 include 未传时使用
# tilt:画面倾斜
# screen:画面中蓝黑白正常幕布检测
# quality_abnormal:图像质量检测虚焦、偏色、雪花噪点、花屏
# occlusion:遮挡检测
default_modules = ["tilt", "screen", "quality_abnormal", "occlusion"]
# 倾斜角度阈值，单位度
tilt_threshold = 1.5
# 屏幕 YOLO 置信度阈值
screen_conf = 0.25
# 屏幕 YOLO NMS IoU 阈值
screen_iou = 0.45
# 遮挡 YOLO-seg 置信度阈值
occlusion_threshold = 0.25
# 遮挡面积占比判定阈值
occlusion_area_ratio = 0.2

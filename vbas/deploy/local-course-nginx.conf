events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    aio threads;
    server_tokens off;

    server {
        listen 80;
        server_name _;
        charset utf-8;

        root /usr/share/nginx/html;
        autoindex on;
        autoindex_exact_size on;
        autoindex_localtime on;

        location / {
            try_files $uri =404;
        }
    }
}

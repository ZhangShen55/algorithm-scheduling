services:
  tias-8981:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tias-8981
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8981
    env_file:
      - ./env.example
    environment:
      CONFIG_PATH: /workspace/config.toml
    ports:
      - "8981:8981"
    volumes:
      - ./examples/tias-8981.toml:/workspace/config.toml:ro
      - ../models:/workspace/models:ro
      - ../models-encrypted:/workspace/models-encrypted:ro
      - ./secrets/tias_model_key:/run/secrets/tias_model_key:ro

  tias-8982:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tias-8982
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8982
    env_file:
      - ./env.example
    environment:
      CONFIG_PATH: /workspace/config.toml
    ports:
      - "8982:8982"
    volumes:
      - ./examples/tias-8982.toml:/workspace/config.toml:ro
      - ../models:/workspace/models:ro
      - ../models-encrypted:/workspace/models-encrypted:ro
      - ./secrets/tias_model_key:/run/secrets/tias_model_key:ro

[service]
# 服务名称，用于日志、健康检查和指标标识。
name = "online-gateway-service"
# HTTP 监听地址。
host = "0.0.0.0"
# HTTP 监听端口。
port = 8001
# Uvicorn 工作进程数。
workers = 1
# 运行环境标识。
environment = "development"
# 日志级别。
log_level = "INFO"
# 请求链路标识请求头。
trace_header = "X-Trace-ID"

[logging]
# 日志级别；支持 CRITICAL、ERROR、WARNING、INFO、DEBUG、NOTSET。
level = "INFO"
# 相对 online_gateway_service 项目根的日志目录；不挂载时写入容器内该目录。
directory = "logs"
# 当前实例活动日志文件名。
file_name = "application.log"
# 单个日志文件最大大小，单位 MiB。
max_file_size_mib = 100
# 归档日志保留天数。
retention_days = 7
# 是否同时输出到容器 stdout。
stdout_enabled = true
# 是否写入项目根日志文件。
file_enabled = true

[control]
# 控制服务基础地址。
base_url = "http://127.0.0.1:18100"
# 控制服务请求超时秒数。
timeout_seconds = 10.0

[face_persons]
# FaceRec 人物管理接口基础地址；必须指向单一固定管理实例，不申请推理容量租约。
base_url = "http://127.0.0.1:8003"

[http]
# 下游 HTTP 连接池最大连接数。
max_connections = 2048
# 下游 HTTP 连接池最大保活连接数。
max_keepalive_connections = 512
# 建立下游 HTTP 连接的超时秒数。
connect_timeout_seconds = 5.0
# 读取下游 HTTP 响应的超时秒数。
read_timeout_seconds = 60.0
# 写入下游 HTTP 请求的超时秒数。
write_timeout_seconds = 60.0
# 从 HTTP 连接池获取连接的有界正数超时秒数。
pool_timeout_seconds = 5.0
# 在线同步请求从进入网关到返回结果的端到端总预算秒数。
hard_timeout_seconds = 600.0
# 在线纯推理算子调用总尝试次数，包含首次调用。
operator_max_attempts = 3
# 在线纯推理失败后的基础退避秒数。
retry_base_delay_seconds = 0.2
# 在线纯推理指数退避允许达到的最大秒数。
retry_max_delay_seconds = 2.0

[leases]
# 普通在线请求容量租约秒数。
request_ttl_seconds = 60
# WebSocket 流式请求容量租约秒数。
websocket_ttl_seconds = 3600
# 同一 lease_id 在 TTL 安全窗口内的续租总尝试次数。
renewal_max_attempts = 3
# 首次续租重试前的基础退避秒数。
renewal_base_delay_seconds = 0.2
# 续租指数退避允许达到的最大秒数。
renewal_max_delay_seconds = 2.0
# 最近确认到期时间前停止使用租约的安全余量秒数。
renewal_safety_margin_seconds = 5.0
# 租约不足时最多等待的总秒数。
acquire_wait_timeout_seconds = 300.0
# 首次租约申请失败后的基础重试间隔，后续按退避增加并带随机抖动。
acquire_retry_interval_seconds = 0.2

[base64]
# Base64 图片解码后允许的最大字节数。
max_decoded_bytes = 52428800
# 是否允许带媒体类型前缀的数据地址。
allow_data_uri = true

[body]
# HTTP 请求体允许的最大字节数。
max_bytes = 75497472

[websocket]
# 建立上游 WebSocket 连接的超时秒数。
open_timeout_seconds = 10.0
# WebSocket 心跳发送间隔秒数。
ping_interval_seconds = 20.0
# WebSocket 心跳响应超时秒数。
ping_timeout_seconds = 20.0
# WebSocket 关闭握手超时秒数。
close_timeout_seconds = 10.0
# 单次实时 ASR WebSocket 会话的绝对时长上限秒数。
session_timeout_seconds = 14400.0

[readiness]
# 就绪检查依赖超时秒数。
dependency_timeout_seconds = 3.0
# 就绪检查是否要求控制服务可用。
require_control = true

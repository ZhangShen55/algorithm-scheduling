# SeaCraftASR 配置文件

# 基础配置
id_engine = "1"

# 设备与并发配置
device = "cpu"
concurrency = 5              # 单实例 GPU slot 并发数
gpu_slot_timeout_seconds = 720  # 等待 GPU slot 的最长秒数，超时后返回 408/业务超时

[platform]
# 本地默认不主动向调度平台注册
registration_enabled = false
control_service_url = ""  # 启用注册时填写 Control Service 地址
heartbeat_interval_seconds = 5  # 注册心跳间隔秒数，必须为有限正数
# 平台允许同时分发到本实例的离线转写请求数；不覆盖 concurrency
max_concurrent_requests = 4

[runtime]
# 本地默认允许 CPU；GPU 部署配置显式设为 true
require_gpu = false

[logging]
# 日志级别。
level = "INFO"
# 相对项目根的日志目录；未挂载时写入容器内该目录。
directory = "logs"
# 当前实例日志文件名。
file_name = "application.log"
# 单个日志文件最大大小，单位 MiB。
max_file_size_mib = 100
# 归档日志保留天数。
retention_days = 7
# 是否输出到 stdout。
stdout_enabled = true
# 是否写入文件。
file_enabled = true

# 模型路径配置
[model_paths]
vad_model_dir = "./model/speech_fsmn_vad_zh-cn-16k-common-pytorch"
punc_model_dir = "./model/punc_ct-transformer_cn-en-common-vocab471067-large"
asr_model_dir = "./model/speech_seaco_paraformer_large_asr_nat-zh-cn-16k-common-vocab8404-pytorch"
spk_model_dir = "./model/speech_campplus_sv_zh_en_16k-common_advanced"
emotion_model_dir = "./model/emotion2vec_plus_large"
whisper_model_dir = "./model/faster-whisper-large-v3"

# 语速计算配置
[speech_rate]
rate_factor = 0.4  # 语速修正系数（数值偏高时下调），最终语速 = 原始字/分钟 * rate_factor

# 长音频分块配置（仅对 showSpk=true 生效）
[audio_chunk]
threshold_minutes = 90       # 超过此时长才触发分块
chunk_minutes = 60           # 每块目标时长（分钟）
min_last_chunk_minutes = 15  # 最后一块不足此值则并入前一块
overlap_seconds = 15         # 块间重叠（秒），防止句子被硬截断
chunk_retry_count = 2        # 单块 GPU 推理失败后最多重试次数

# 功能开关配置
[features]
open_spk = true
open_emotion = true
ban_hotword = true
open_mul_lang = false

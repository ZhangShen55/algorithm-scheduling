services:
  facerecapi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: facerecapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../config.toml:/app/config.toml:ro
      - ../logs:/app/logs
      - ../media:/app/media
      - ../ai_models:/app/ai_models:ro
    environment:
      - GPU_PROCESS_NAME=facerec
      - UVICORN_WORKERS=1
      - PORT=8000
      - CONFIG_PATH=/app/config.toml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - facerecapi-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ops/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  facerecapi-network:
    driver: bridge

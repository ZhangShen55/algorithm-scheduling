[platform]
# 本地默认不主动向调度平台注册
registration_enabled = false
control_service_url = ""  # 启用注册时填写 Control Service 地址
heartbeat_interval_seconds = 5  # 注册心跳间隔秒数，必须为有限正数
# 平台允许同时分发到本实例的人脸请求数；不覆盖 Dlib 进程池
max_concurrent_requests = 128

[runtime]
# 本地默认允许 CPU；GPU 部署配置显式设为 true
require_gpu = false

[db]
username = "root"  # 数据库用户名
password = "root"  # 数据库密码
host = "10.80.5.25"  # 数据库地址
port = "27017"  # 数据库端口
database = "facerecapi" # 数据库名称
auth_source = "admin" # 数据库认证源
limit = 5000 # 限制返回结果条数
[face]
threshold = 0.4 # 人脸识别阈值
candidate_threshold = 0.2 # 候选人脸阈值
rec_min_face_hw = 50 # （识别阶段）最小人脸高度和宽度
[gpu]
device = "cpu"  # 可选 cpu 或 cuda:N，例如 cuda:0
[threading]
max_workers = 2  # dlib 但是实例的进程数
[frontlogin]
username = "admin"  # 前端登录用户名
password = "admin"  # 前端登录密码
[image]
max_feature_image_width_px = 9999  # 最大特征图片宽度 （以下都是为了控制像素大小）
max_feature_image_height_px = 9999  # 最大特征图片高度
min_feature_image_width_px = 80     # 最小特征图片宽度
min_feature_image_height_px = 80    # 最小特征图片高度
max_feature_image_size_m = 10 # 最大特征图片大小（MB）
max_face_hw = 999  # （提取特征阶段）最大人脸高度和宽度
min_face_hw = 50  # 最小人脸高度和宽度
save_person_photo = false  # false 时只保存 embedding，不保存裁剪后的人脸图片
[logger]
level = "INFO"  # 兼容旧字段；新部署使用 [logging]
log_path = "./logs/facere_service.log"  # 兼容旧日志路径

[logging]
# 日志级别。
level = "INFO"
# 相对项目根的日志目录；未挂载时写入容器内该目录。
directory = "logs"
# 当前实例日志文件名。
file_name = "application.log"
# 单个日志文件最大大小，单位 MiB。
max_file_size_mib = 100
# 归档日志保留天数。
retention_days = 7
# 是否输出到 stdout。
stdout_enabled = true
# 是否写入文件。
file_enabled = true

[stats]
# 统计数据保留天数（自动清理超过该天数的数据）
retention_days = 7  # 保留7天的详细日志
hourly_retention_days = 30  # 保留30天的按小时聚合数据

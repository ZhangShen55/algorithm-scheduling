# SeaCraftASR 在线识别服务配置

id_engine = "online-1"
version = "seacraft-asr-online-v1.0.0"

# 设备配置（建议与主服务使用不同 GPU 以避免显存竞争）
device = "cpu"
ngpu = 0

# 日志
log_path = "./asr_online_service.log"

[platform]
# 本地默认不主动向调度平台注册
registration_enabled = false
# 启用注册时填写 Control Service 地址
control_service_url = ""
# 注册心跳间隔秒数，必须为有限正数
heartbeat_interval_seconds = 5
# 平台允许同时分发到本实例的实时会话数
max_concurrent_requests = 10

[runtime]
# 本地默认允许 CPU；GPU 部署配置显式设为 true
require_gpu = false

# 模型默认使用镜像内 ./model，可按需添加 [model_paths] 覆盖。

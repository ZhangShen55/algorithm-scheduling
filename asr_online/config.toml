# SeaCraftASR 在线识别服务配置

id_engine = "online-1"
version = "seacraft-asr-online-v1.0.0"

# 使用cpu启动 device = "cpu"，gpu启动 device = "cuda:0"
device = "cpu"
# 使用gpu数量的参数，1：表示使用1张GPU，如果使用GPU，默认为1，CPU为0
ngpu = 0
# v1.0.2/v1.0.3 VAD 确认话段结束所需的尾部静音时长（毫秒）。
vad_max_end_silence_ms = 1000
# VAD end 后等待短间隔新语音并合并到同一字幕段的最大间隔（毫秒）。
vad_merge_max_gap_ms = 720
# v1.0.3 在 finished=true 前启用 SenseVoice 中间纠正。
progressive_correction_enabled = true
# 稳定文本新增字符数、无纠正最大音频时长和两次提交的最短冷却时间。
progressive_correction_chars = 8
progressive_correction_audio_ms = 4800
progressive_correction_cooldown_ms = 2000
# SenseVoice 纠正 worker，不是 Uvicorn worker；每个 worker 独占一个模型实例。
sensevoice_correction_workers = 1
correction_queue_capacity = 16
correction_task_timeout_ms = 5000
# SenseVoice 可单独放到另一张 GPU；删除本配置项时继承主 device。
sensevoice_correction_device = "cpu"
# v1.0.4 周期累计 Paraformer 纠正，句末独立限时收尾。
v4_final_budget_ms = 100
v4_max_segment_seconds = 20
v4_partial_punctuation_chars = 8
v4_partial_punctuation_interval_ms = 2000
v4_correction_queue_capacity = 8
v4_correction_workers = 1
v4_correction_interval_ms = 4000
v4_correction_device = "cpu"
v4_punctuation_device = "cpu"
# v1.0.4 Paraformer-large 纠正后的逆文本正则化，再进入标点模型。
v4_itn_enabled = true
v4_itn_failure_mode = "passthrough"
v4_itn_remove_interjections = true
v4_itn_enable_standalone_number = true
v4_itn_enable_0_to_9 = false
v4_itn_enable_million = false

[logging]
# 日志级别。
level = "INFO"
# 相对项目根的日志目录；未挂载时写入容器内该目录。
directory = "logs"
# 当前实例日志文件名。
file_name = "application.log"
# 单个日志文件最大大小，单位 MiB。
max_file_size_mib = 100
# 归档日志保留天数。
retention_days = 7
# 是否输出到 stdout。
stdout_enabled = true
# 是否写入文件。
file_enabled = true

[platform]
# 本地默认不主动向调度平台注册
registration_enabled = false
# 启用注册时填写 Control Service 地址
control_service_url = ""
# 注册心跳间隔秒数，必须为有限正数
heartbeat_interval_seconds = 5
# 平台允许同时分发到本实例的实时会话数
max_concurrent_requests = 10

[runtime]
# 本地默认允许 CPU；GPU 部署配置显式设为 true
require_gpu = false

[model_paths]
# v1.0.2 的 VAD 与句末二遍识别模型固定从项目内 model/ 加载。
vad_model_dir = "model/speech_fsmn_vad_zh-cn-16k-common-pytorch"
asr_online_correction_model_dir = "model/speech_seaco_paraformer_large_asr_nat-zh-cn-16k-common-vocab8404-pytorch"
# v1.0.3 使用 SenseVoice 自带标点，不调用独立标点模型。
sensevoice_model_dir = "model/SenseVoiceSmall"
v4_correction_model_dir = "model/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-pytorch"
